<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rueda Nocturna · Rutas</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
    </head>
<body class="bg-slate-100 p-6 font-sans antialiased text-slate-800">
  <main class="max-w-md mx-auto space-y-6">
    
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold tracking-wide uppercase text-slate-900">Ruta Nocturna Rueda Libre</h1>
      <p class="text-sm text-slate-600">Explora la ciudad bajo las estrellas con seguridad y guía experta.</p>
    </header>

    <article class="bg-white border border-slate-200 rounded-xl shadow-md overflow-hidden transition-shadow hover:shadow-xl">
      <img class="w-full h-48 object-cover" src="https://picsum.photos/seed/luces/640/320" alt="Ciclistas recorriendo el centro de Medellín de noche">
      <div class="p-5 space-y-4">
        <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Fácil</span>
        <h2 class="text-2xl font-bold text-slate-900">Luces del Centro</h2>
        
        <dl class="grid grid-cols-3 gap-2 py-2 border-y border-slate-100">
          <div><dt class="text-xs text-slate-500 uppercase font-medium">Distancia</dt><dd class="font-semibold text-slate-800">10 km</dd></div>
          <div><dt class="text-xs text-slate-500 uppercase font-medium">Duración</dt><dd class="font-semibold text-slate-800">2 h</dd></div>
          <div><dt class="text-xs text-slate-500 uppercase font-medium">Punto</dt><dd class="font-semibold text-slate-800">Sede</dd></div>
        </dl>
        
        <div class="flex items-center justify-between">
          <span class="text-2xl font-black text-slate-900">$55.000</span>
          <a href="#inscripcion" class="inline-block bg-amber-400 text-slate-900 font-bold uppercase text-sm tracking-wide px-6 py-3 rounded-full hover:bg-amber-300 focus:outline-hidden focus:ring-2 focus:ring-amber-200 transition-colors">Inscríbete</a>
        </div>
      </div>
    </article>

  </main>
</body>
</html>
